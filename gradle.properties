# Turnypt build configuration.
#
# Memory-constrained by design: compilation and packaging are serialized
# (single worker, no parallel execution) so peak memory stays predictable
# on machines with limited RAM. Kotlin compilation runs in a shared
# compiler daemon whose heap is capped; environments below ~4 GiB RAM
# should additionally set kotlin.compiler.execution.strategy=in-process in
# their user-level gradle.properties to keep everything in one JVM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx512m
kotlin.compiler.execution.strategy=in-process

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
